<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Page Not Found</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #fff;
            color: #222;
            text-align: center;
        }

        .container {
            padding: 30px;
        }

        h1 {
            font-size: 100px;
            letter-spacing: -5px;
        }

        p {
            color: #777;
            margin: 15px 0 30px;
        }

        a {
            display: inline-block;
            padding: 12px 28px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        a:hover {
            background: #555;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>404</h1>
        <p>お探しのページは見つかりませんでした。</p>
        <a href="/">BACK TO HOME</a>
    </div>
</body>

</html>
