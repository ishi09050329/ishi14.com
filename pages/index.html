<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ishi. | Personal Website</title>
    <meta name="description" content="気象・防災に関心があり、プログラミングやWeb制作にも取り組むishiの個人サイトです。">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont,
                "Helvetica Neue", "Noto Sans JP", sans-serif;
            background-color: #ffffff;
            color: #222222;
        }

        /* =========================
   HEADER
========================= */

        .header {
            width: 100%;
            height: 75px;
            padding: 0 10%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            border-bottom: 1px solid #eeeeee;
        }

        .logo {
            font-size: 25px;
            font-weight: 700;
            color: #222222;
            text-decoration: none;
            letter-spacing: -1px;
        }

        .nav {
            display: flex;
            align-items: center;
            gap: 32px;
        }

        .nav a {
            font-size: 12px;
            font-weight: 600;
            color: #555555;
            text-decoration: none;
            letter-spacing: 1px;
            transition: color 0.2s ease;
        }

        .nav a:hover {
            color: #3478f6;
        }

        /* ハンバーガーメニュー */

        .menu-toggle {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
        }

        .menu-toggle span {
            display: block;
            width: 24px;
            height: 2px;
            margin: 5px 0;
            background-color: #222222;
            transition: 0.2s ease;
        }

        /* =========================
   MAIN / HERO
========================= */

        main {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            padding: 100px 10% 40px;
        }

        .welcome {
            font-size: 13px;
            letter-spacing: 2px;
            color: #777777;
            margin-bottom: 20px;
        }

        h1 {
            font-size: clamp(56px, 10vw, 100px);
            font-weight: 700;
            letter-spacing: -3px;
            margin-bottom: 20px;
        }

        .description {
            font-size: 16px;
            line-height: 1.9;
            color: #666666;
        }

        /* =========================
   MOBILE
========================= */

        @media (max-width: 768px) {

            .header {
                height: 65px;
                padding: 0 6%;
            }

            .logo {
                font-size: 23px;
            }

            .menu-toggle {
                display: block;
            }

            .nav {
                display: none;
                position: absolute;
                top: 65px;
                left: 0;
                width: 100%;
                padding: 24px 6%;
                background-color: #ffffff;
                border-bottom: 1px solid #eeeeee;
                flex-direction: column;
                align-items: flex-start;
                gap: 24px;
            }

            .nav.active {
                display: flex;
            }

            .nav a {
                font-size: 13px;
            }

            main {
                padding: 90px 7% 40px;
            }

            .welcome {
                font-size: 11px;
            }

            h1 {
                font-size: 64px;
            }

            .description {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>


    <header class="header">
        <a href="#" class="logo">ishi.</a>

        <nav class="nav">
            <a href="#about">ABOUT</a>
            <a href="#projects">PROJECTS</a>
            <a href="#activities">ACTIVITIES</a>
            <a href="#blog">BLOG</a>
        </nav>

        <button class="menu-toggle" aria-label="メニューを開く" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </header>

    <main>
        <p class="welcome">WELCOME TO MY WEBSITE</p>

        <h1>ishi</h1>

        <p class="description">
            気象・防災に関心があり、<br>
            プログラミングやWeb制作にも取り組んでいます。
        </p>
    </main>
</body>
<script>
    const menuToggle = document.querySelector(".menu-toggle");
    const nav = document.querySelector(".nav");

    menuToggle.addEventListener("click", () => {
        const isOpen = nav.classList.toggle("active");

        menuToggle.setAttribute("aria-expanded", isOpen);
        menuToggle.setAttribute(
            "aria-label",
            isOpen ? "メニューを閉じる" : "メニューを開く"
        );
    });

    nav.querySelectorAll("a").forEach(link => {
        link.addEventListener("click", () => {
            nav.classList.remove("active");
            menuToggle.setAttribute("aria-expanded", "false");
            menuToggle.setAttribute("aria-label", "メニューを開く");
        });
    });
</script>

</html>
